[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectre-impact"
version = "1.0.0"
description = "AI-powered GitHub change intelligence platform"
readme = "BACKEND_STARTER_README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "rq>=1.16.0",
    "PyGithub>=2.3.0",
    "groq>=0.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
spectre = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"ai_agent_groq.py" = "ai_agent_groq.py"
"database.py" = "database.py"
"github_client.py" = "github_client.py"
"backend" = "backend"
"job_queue" = "job_queue"
