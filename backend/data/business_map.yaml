# Estimated percentage of users affected when a component is unavailable.
# The engine uses the maximum value among all affected nodes (worst case).
#
# peak_hours: the time window (Africa/Cairo local) when this component
#             carries the most traffic. Used by Lya when reasoning about
#             whether it's safe to merge now or schedule for later.
#
# avg_daily_transaction_value: approximate USD value of transactions that
#             flow through this component per day. 0 for pure
#             infrastructure nodes that carry no direct revenue.

