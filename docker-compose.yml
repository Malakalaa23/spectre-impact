services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - SPECTRE_DATA_API_URL=http://realtime:8000
    volumes:
      - ./runtime_data:/app/runtime_data
    depends_on:
      - realtime

  realtime:
    build: .
    command: uvicorn realtime_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./runtime_data:/app/runtime_data
